<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hatay Zurna Dürüm Avcısı - Yılan Oyunu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #060608;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f1f1f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 14px;
      touch-action: manipulation;
      overflow-x: hidden;
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 400px;
      width: 100%;
    }

    .game-container {
      background: #111116;
      padding: 16px;
      border-radius: 20px;
      border: 1px solid #282836;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .title-box h1 {
      font-size: 17px;
      font-weight: 800;
      color: #ff7b00;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .score-board {
      display: flex;
      gap: 6px;
    }

    .score-badge {
      background: #181822;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid #2c2c3d;
      text-align: center;
      min-width: 58px;
    }

    .score-badge span {
      display: block;
      font-size: 8px;
      color: #8c8c9e;
      text-transform: uppercase;
      font-weight: 600;
    }

    .score-badge b {
      font-size: 16px;
      color: #ff7b00;
      font-family: monospace;
    }

    .score-badge.high b { color: #38ef7d; }
    .score-badge.speed b { color: #ffd000; }

    .canvas-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #282836;
      touch-action: none;
    }

    canvas {
      display: block;
      background-color: #07070a;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 7, 10, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 16px;
    }

    .overlay.hidden { display: none; }

    .overlay h2 {
      font-size: 23px;
      color: #ff7b00;
      margin-bottom: 4px;
      font-weight: 800;
    }

    .overlay p {
      font-size: 13px;
      color: #b2b2c4;
      margin-bottom: 16px;
      text-align: center;
      max-width: 270px;
      line-height: 1.35;
    }

    .color-picker-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
      width: 100%;
    }

    .color-picker-label {
      font-size: 11px;
      color: #a0a0b8;
      font-weight: 600;
      text-transform: uppercase;
    }

    .color-options {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #2a2a38;
      cursor: pointer;
      outline: none;
    }

    .color-btn.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    .color-kirmizi { background: #ff2a4b; }
    .color-mavi    { background: #00b4d8; }
    .color-sari    { background: #ffd166; }
    .color-pembe   { background: #ff70a6; }
    .color-yesil   { background: #06d6a0; }
    .color-mor     { background: #b5179e; }

    .btn {
      background: #ff7b00;
      color: white;
      border: none;
      padding: 10px 30px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
    }

    .dpad-container {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 52px);
      gap: 10px;
      justify-content: center;
      touch-action: manipulation;
    }

    .dpad-btn {
      background: #181822;
      border: 1.5px solid #323246;
      border-radius: 12px;
      color: #e0e0f0;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }

    .mobile-tip {
      margin-top: 10px;
      font-size: 11px;
      color: #78788e;
      text-align: center;
    }

    .controls-hint {
      margin-top: 8px;
      font-size: 11px;
      color: #626274;
      display: flex;
      gap: 10px;
    }

    .key-badge {
      background: #1e1e28;
      color: #d2d2e4;
      padding: 2px 6px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 10px;
      border: 1px solid #343444;
    }

    @media (max-width: 480px) {
      .controls-hint { display: none; }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="game-container">
      <div class="header">
        <div class="title-box">
          <h1>🌯 Zurna Dürüm Yılanı</h1>
        </div>
        <div class="score-board">
          <div class="score-badge">
            <span>Skor</span>
            <b id="score">0</b>
          </div>
          <div class="score-badge speed">
            <span>Hız</span>
            <b id="speedLevel">0.5x</b>
          </div>
          <div class="score-badge high">
            <span>En Yüksek</span>
            <b id="high-score">0</b>
          </div>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="360" height="360"></canvas>
        
        <div id="gameOverlay" class="overlay">
          <h2 id="overlayTitle">🌯 Hatay Zurna Avcısı</h2>
          <p id="overlayDesc">En yüksek skoru yapmak için dürümleri topla!</p>

          <div class="color-picker-box">
            <span class="color-picker-label">Yılan Rengini Seç:</span>
            <div class="color-options" id="colorOptions">
              <button class="color-btn color-kirmizi active" data-color="kirmizi" title="Kırmızı"></button>
              <button class="color-btn color-mavi" data-color="mavi" title="Mavi"></button>
              <button class="color-btn color-sari" data-color="sari" title="Sarı"></button>
              <button class="color-btn color-pembe" data-color="pembe" title="Pembe"></button>
              <button class="color-btn color-yesil" data-color="yesil" title="Yeşil"></button>
              <button class="color-btn color-mor" data-color="mor" title="Mor"></button>
            </div>
          </div>

          <button id="startBtn" class="btn">Dürümleri Topla!</button>
        </div>
      </div>

      <div class="dpad-container">
        <button class="dpad-btn dpad-up" id="btnUp">▲</button>
        <button class="dpad-btn dpad-left" id="btnLeft">◀</button>
        <button class="dpad-btn dpad-down" id="btnDown">▼</button>
        <button class="dpad-btn dpad-right" id="btnRight">▶</button>
      </div>

      <div class="mobile-tip">
        <span>👆 Parmağını ekranda kaydırarak (Swipe) da oynayabilirsin!</span>
      </div>

      <div class="controls-hint">
        <span>Klavye: <span class="key-badge">W A S D</span> veya <span class="key-badge">▲ ◀ ▼ ▶</span></span>
        <span>Duraklat: <span class="key-badge">Boşluk</span></span>
      </div>
    </div>
  </div>

  <script>
    const COLOR_THEMES = {
      kirmizi: { head: '#ff2a4b', body: '#e60026', hex: '#ff2a4b' },
      mavi:    { head: '#00b4d8', body: '#0077b6', hex: '#00b4d8' },
      sari:    { head: '#ffd166', body: '#f77f00', hex: '#ffd166' },
      pembe:   { head: '#ff70a6', body: '#e01e5a', hex: '#ff70a6' },
      yesil:   { head: '#06d6a0', body: '#049a72', hex: '#06d6a0' },
      mor:     { head: '#b5179e', body: '#7209b7', hex: '#b5179e' }
    };

    let selectedColorKey = localStorage.getItem('snake_chosen_color') || 'kirmizi';
    let localHighScore = localStorage.getItem('snake_local_highscore') || 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function vibrate(pattern = 15) {
      if (window.navigator && window.navigator.vibrate) try { window.navigator.vibrate(pattern); } catch (e) {}
    }

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'eat') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(540, now);
        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
        vibrate(20);
      } else if (type === 'die') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
        vibrate([40, 30, 40]);
      }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreElement = document.getElementById('score');
    const speedLevelElement = document.getElementById('speedLevel');
    const highScoreElement = document.getElementById('high-score');
    const gameOverlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const startBtn = document.getElementById('startBtn');
    const colorOptionsContainer = document.getElementById('colorOptions');

    highScoreElement.textContent = localHighScore;

    const GRID_SIZE = 15;
    const TILE_SIZE = canvas.width / GRID_SIZE;

    const BASE_SPEED = 180;
    const MIN_SPEED = 60;
    let currentSpeed = BASE_SPEED;
    let durumEatenCount = 0;

    let snake = [];
    let direction = { x: 1, y: 0 };
    let inputQueue = [];
    let durum = { x: 10, y: 7 };
    let score = 0;

    let isRunning = false;
    let isPaused = false;

    let mysteryBox = null;
    let boxMessage = "";
    let boxMessageTimer = null;
    let lastRenderTime = 0;
    let animationFrameId = null;

    function setupColorPicker() {
      const btns = colorOptionsContainer.querySelectorAll('.color-btn');
      btns.forEach(btn => {
        if (btn.getAttribute('data-color') === selectedColorKey) btn.classList.add('active');
        else btn.classList.remove('active');

        btn.addEventListener('click', () => {
          btns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedColorKey = btn.getAttribute('data-color');
          localStorage.setItem('snake_chosen_color', selectedColorKey);
          render();
        });
      });
    }

    function drawZurnaDurum(x, y) {
      const px = x * TILE_SIZE, py = y * TILE_SIZE;
      const pad = 3;
      
      ctx.fillStyle = '#e5a25d';
      ctx.beginPath();
      ctx.roundRect(px + pad, py + pad, TILE_SIZE - (pad * 2), TILE_SIZE - (pad * 2), 4);
      ctx.fill();

      ctx.fillStyle = '#cc2b1e';
      ctx.fillRect(px + pad + 2, py + pad, TILE_SIZE - (pad * 2) - 4, 3);

      ctx.fillStyle = '#2b9348';
      ctx.fillRect(px + pad + 4, py + pad + 3, TILE_SIZE - (pad * 2) - 8, 2);

      ctx.fillStyle = '#a8b2d1';
      ctx.fillRect(px + pad, py + (TILE_SIZE / 2), TILE_SIZE - (pad * 2), (TILE_SIZE / 2) - pad);
      ctx.fillStyle = '#d0d7de';
      ctx.fillRect(px + pad + 2, py + (TILE_SIZE / 2) + 2, 3, (TILE_SIZE / 2) - pad - 4);
    }

    function drawMysteryBox() {
      if (!mysteryBox) return;
      const px = mysteryBox.x * TILE_SIZE, py = mysteryBox.y * TILE_SIZE;
      ctx.fillStyle = '#ffb700';
      ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
      ctx.fillStyle = '#101015';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?', px + TILE_SIZE / 2, py + TILE_SIZE / 2);
    }

    function drawBoxMessage() {
      if (!boxMessage) return;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(boxMessage, canvas.width / 2, 30);
    }

    function drawGrid() {
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? '#0b0b0f' : '#14141a';
          ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
      }
    }

    function drawSnake() {
      const theme = COLOR_THEMES[selectedColorKey] || COLOR_THEMES.kirmizi;
      const size = TILE_SIZE - 2;

      snake.forEach((segment, index) => {
        const x = segment.x * TILE_SIZE + 1;
        const y = segment.y * TILE_SIZE + 1;

        if (index === 0) {
          ctx.fillStyle = theme.head;
          ctx.fillRect(x, y, size, size);

          ctx.fillStyle = '#ffffff';
          let eye1 = { x: x + 4, y: y + 4 }, eye2 = { x: x + size - 6, y: y + 4 };
          if (direction.x === 1) { eye1 = { x: x + size - 5, y: y + 4 }; eye2 = { x: x + size - 5, y: y + size - 6 }; }
          else if (direction.x === -1) { eye1 = { x: x + 4, y: y + 4 }; eye2 = { x: x + 4, y: y + size - 6 }; }
          else if (direction.y === 1) { eye1 = { x: x + 4, y: y + size - 5 }; eye2 = { x: x + size - 6, y: y + size - 5 }; }

          ctx.fillRect(eye1.x, eye1.y, 3, 3);
          ctx.fillRect(eye2.x, eye2.y, 3, 3);
        } else {
          ctx.fillStyle = theme.body;
          ctx.fillRect(x, y, size, size);
        }
      });
    }

    function spawnDurum() {
      let valid = false;
      while (!valid) {
        durum = { x: Math.floor(Math.random() * GRID_SIZE), y: Math.floor(Math.random() * GRID_SIZE) };
        valid = !snake.some(s => s.x === durum.x && s.y === durum.y);
      }
    }

    function spawnMysteryBox() {
      let valid = false;
      while (!valid) {
        mysteryBox = { x: Math.floor(Math.random() * GRID_SIZE), y: Math.floor(Math.random() * GRID_SIZE) };
        const isOnSnake = snake.some(s => s.x === mysteryBox.x && s.y === mysteryBox.y);
        const isOnDurum = (durum.x === mysteryBox.x && durum.y === mysteryBox.y);
        if (!isOnSnake && !isOnDurum) valid = true;
      }
    }

    function applyMysteryEffect() {
      const rand = Math.random() * 100;

      if (rand < 1) {
        score += 100;
        scoreElement.textContent = score;
        showBoxMessage("🔥 +100 EFSANE PUAN!");
      } else if (rand < 11) {
        score += 50;
        scoreElement.textContent = score;
        showBoxMessage("🎉 +50 BÜYÜK PUAN!");
      } else if (rand < 55.5) {
        score += 10;
        scoreElement.textContent = score;
        showBoxMessage("⭐ +10 Puan!");
      } else {
        score = Math.max(0, score - 10);
        scoreElement.textContent = score;
        showBoxMessage("💥 -10 Puan!");
      }
    }

    function recalculateSpeed() {
      const baseCalc = BASE_SPEED - (durumEatenCount * 1.5);
      currentSpeed = Math.max(MIN_SPEED, baseCalc);
      speedLevelElement.textContent = (130 / currentSpeed).toFixed(1) + 'x';
    }

    function showBoxMessage(msg) {
      boxMessage = msg;
      if (boxMessageTimer) clearTimeout(boxMessageTimer);
      boxMessageTimer = setTimeout(() => { boxMessage = ""; }, 2000);
    }

    function update() {
      if (!isRunning || isPaused) return;

      if (inputQueue.length > 0) {
        const nextDir = inputQueue.shift();
        if (nextDir.x !== -direction.x && nextDir.y !== -direction.y) {
          direction = nextDir;
        }
      }

      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE || snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (mysteryBox && head.x === mysteryBox.x && head.y === mysteryBox.y) {
        playSound('eat');
        applyMysteryEffect();
        mysteryBox = null;
        setTimeout(spawnMysteryBox, 10000);
      }

      if (head.x === durum.x && head.y === durum.y) {
        score += 10;
        durumEatenCount += 1;
        scoreElement.textContent = score;
        playSound('eat');
        spawnDurum();
        recalculateSpeed();
      } else {
        snake.pop();
      }
    }

    function gameLoop(currentTime) {
      if (!isRunning) return;

      if (!lastRenderTime) lastRenderTime = currentTime;
      const deltaTime = currentTime - lastRenderTime;

      if (deltaTime >= currentSpeed) {
        update();
        lastRenderTime = currentTime;
      }

      render();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawZurnaDurum(durum.x, durum.y);
      drawMysteryBox();
      drawSnake();
      drawBoxMessage();
    }

    function initGame() {
      snake = [{ x: 4, y: 7 }, { x: 3, y: 7 }, { x: 2, y: 7 }];
      direction = { x: 1, y: 0 };
      inputQueue = [];
      score = 0;
      durumEatenCount = 0;
      currentSpeed = BASE_SPEED;
      scoreElement.textContent = score;
      speedLevelElement.textContent = '0.5x';

      spawnDurum();
      mysteryBox = null;
      boxMessage = "";
      spawnMysteryBox();
      
      isRunning = true;
      isPaused = false;
      gameOverlay.classList.add('hidden');

      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      lastRenderTime = performance.now();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      isRunning = false;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      playSound('die');

      if (score > localHighScore) {
        localHighScore = score;
        localStorage.setItem('snake_local_highscore', localHighScore);
        highScoreElement.textContent = localHighScore;
      }

      overlayTitle.textContent = "Dürüm Bitti! 💥";
      overlayDesc.innerHTML = `Skorun: <b>${score}</b> | En Yüksek: <b>${localHighScore}</b>`;
      startBtn.textContent = "Yeniden Başla";
      gameOverlay.classList.remove('hidden');
    }

    function setDirection(newDir) {
      if (!isRunning || isPaused) return;
      const lastDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : direction;
      if (newDir.x !== -lastDir.x && newDir.y !== -lastDir.y) {
        if (inputQueue.length < 2) inputQueue.push(newDir);
      }
      vibrate(10);
    }

    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      if (!touchStartX || !touchStartY) return;
      const diffX = e.changedTouches[0].clientX - touchStartX;
      const diffY = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (Math.abs(diffX) > 20) setDirection(diffX > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
      } else {
        if (Math.abs(diffY) > 20) setDirection(diffY > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
      }
      touchStartX = 0; touchStartY = 0;
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();

      if (e.key === ' ' || e.code === 'Space') {
        if (!isRunning) initGame();
        else {
          isPaused = !isPaused;
          if (isPaused) {
            overlayTitle.textContent = "Duraklatıldı ⏸️";
            overlayDesc.textContent = "Devam etmek için Boşluk tuşuna bas.";
            startBtn.textContent = "Devam Et";
            gameOverlay.classList.remove('hidden');
          } else {
            gameOverlay.classList.add('hidden');
            lastRenderTime = performance.now();
            animationFrameId = requestAnimationFrame(gameLoop);
          }
        }
        return;
      }

      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': setDirection({ x: 0, y: -1 }); break;
        case 'ArrowDown': case 's': case 'S': setDirection({ x: 0, y: 1 }); break;
        case 'ArrowLeft': case 'a': case 'A': setDirection({ x: -1, y: 0 }); break;
        case 'ArrowRight': case 'd': case 'D': setDirection({ x: 1, y: 0 }); break;
      }
    });

    startBtn.addEventListener('click', () => {
      if (isPaused) {
        isPaused = false;
        gameOverlay.classList.add('hidden');
        lastRenderTime = performance.now();
        animationFrameId = requestAnimationFrame(gameLoop);
      } else {
        initGame();
      }
    });

    function setupDpadBtn(btnId, dir) {
      const btn = document.getElementById(btnId);
      btn.addEventListener('click', () => setDirection(dir));
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); setDirection(dir); }, { passive: false });
    }

    setupDpadBtn('btnUp', { x: 0, y: -1 });
    setupDpadBtn('btnDown', { x: 0, y: 1 });
    setupDpadBtn('btnLeft', { x: -1, y: 0 });
    setupDpadBtn('btnRight', { x: 1, y: 0 });

    setupColorPicker();
    drawGrid();
